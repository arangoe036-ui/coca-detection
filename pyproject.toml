[project]
name = "coca-detection"
version = "0.1.0"
description = "Coca cultivation density detection from free satellite imagery + municipal hotspot map (Colombia)"
readme = "README.md"
requires-python = ">=3.11"

# NOTE: torch / torchgeo / GEE stacks are heavy and platform-specific.
# Versions are pinned loosely here; tighten once the environment is validated on the target machine.
dependencies = [
    # ML
    "torch>=2.2",
    "segmentation-models-pytorch>=0.3.3",
    "torchgeo>=0.6",
    # Geodata / Earth Engine
    "earthengine-api>=0.1.390",
    "geemap>=0.32",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    # Utils
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "albumentations>=1.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Viz / maps (quick checks)
    "matplotlib>=3.8",
    "leafmap>=0.30",
    "folium>=0.16",
]

[project.optional-dependencies]
dev = ["ipykernel", "jupyter", "pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.data", "src.models"]
