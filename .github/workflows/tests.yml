name: tests

# The three defects that invalidated this project's published results were each a single
# silent expression that nothing could fail on. These gates are the point of the repo's
# recovery, so they run on every push rather than when someone remembers.
#
# Deliberately a LIGHT dependency set: no torch, no GDAL. The split/config/metrics gates are
# pure Python over synthetic grids, so they run in seconds. The data-invariant tests
# `importorskip("rasterio")` and additionally skip when no composites are present, so they
# are inert here and enforce locally after a rebuild. Skipped is not passed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pyyaml numpy

      - name: Lint (new code only — the repo has pre-existing cosmetic findings)
        run: ruff check tests/ src/metrics_io.py src/data/tiling.py src/data/multiyear.py
        continue-on-error: true

      - name: Gates — split isolation, config drift, metrics provenance
        run: python -m pytest -q -rs

      - name: Assert the leak gate is present and can detect the old defect
        # A gate that cannot fail is not a gate. test_old_corner_rule_would_leak is the
        # negative control: it must PASS, which means it observed the old corner rule
        # actually leaking. If someone deletes it, this step fails loudly.
        run: |
          python -m pytest -q \
            "tests/test_split_isolation.py::test_no_pixel_overlap_between_splits" \
            "tests/test_split_isolation.py::test_old_corner_rule_would_leak"
