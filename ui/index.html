<!DOCTYPE html>
<!-- P5 map UI (plan §10). Placeholder scaffold — wired up in Phase 5.
     Choropleth of municipal coca hectares over a high-res satellite basemap,
     with a year slider. Data comes from ui/data/municipal_coca.geojson (P4). -->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coca Hotspots — Colombia</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    #panel {
      position: absolute; z-index: 1000; top: 12px; left: 12px;
      background: rgba(255,255,255,.92); padding: 10px 14px; border-radius: 8px;
      font: 14px system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }
    .note { font-size: 12px; color: #555; max-width: 260px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="panel">
    <strong>Coca density by municipality</strong>
    <div>Year: <input id="year" type="range" disabled /> <span id="yearLabel">—</span></div>
    <div class="note">
      Monitoring/analysis tool — aggregate density only, not a target list.
      Basemap is a multi-date mosaic and may not match the analysis year.
    </div>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
